# Baut nach grünen Tests auf main das Image für den Raspberry Pi (arm64) und legt es auf ghcr.io ab:
#   ghcr.io/<besitzer>/baukasten:sha-<commit>  und  :pi (immer der neueste Stand)
# Der Pi prüft alle zwei Minuten, ob es ein Image für den neuesten Commit gibt, und rollt es aus
# (k8s/pi/aktualisieren.sh). Schlagen die Tests fehl, gibt es kein Image – der Pi bleibt beim alten Stand.
name: Pi-Image

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pi-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Image für den Pi bauen (arm64)
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Commit bestimmen
        id: ref
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.sha }}

      # Der Pi Zero 2 W ist arm64; gebaut wird per Emulation auf dem normalen Runner.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}:sha-${{ steps.ref.outputs.sha }}
            ${{ steps.ref.outputs.image }}:pi
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.ref.outputs.sha }}
          cache-from: type=gha,scope=pi
          cache-to: type=gha,scope=pi,mode=max
