# Prüft jede Änderung automatisch: Codeprüfung (ruff) und Lockdatei, Tests mit SQLite und
# PostgreSQL, fehlende Migrationen, und ob das Docker-Image baut.
# Ergebnis steht im Pull Request bzw. unter „Actions“.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Codeprüfung und Lockdatei
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Werkzeuge installieren
        run: pip install "ruff==0.17.6" "packaging>=24"
      - name: ruff
        run: ruff check --output-format=github .
      - name: Lockdatei passt zu requirements*.in
        run: python tools/lockdatei_pruefen.py
      - name: Dev Container liest nur vorhandene Dateien ein
        run: python tools/devcontainer_pruefen.py

  tests:
    # Der Name ohne deps muss so bleiben: Die Regeln für main verlangen genau diese Check-Namen.
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # lock: genau die Versionen aus dem Image (requirements.txt)
          # ranges: neueste Versionen innerhalb der Grenzen aus requirements*.in
          - {python: "3.13", database: postgres, deps: lock}
          - {python: "3.13", database: sqlite, deps: lock}
          - {python: "3.10", database: sqlite, deps: ranges}   # älteste unterstützte Version (README)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: baukasten
          POSTGRES_PASSWORD: baukasten
          POSTGRES_DB: baukasten
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U baukasten"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DEBUG: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements*.in

      - name: Abhängigkeiten installieren (Lockdatei)
        if: matrix.deps == 'lock'
        run: pip install --require-hashes -r requirements.txt

      - name: Abhängigkeiten installieren (neueste innerhalb der Grenzen)
        if: matrix.deps == 'ranges'
        run: pip install -r requirements.in -r requirements-automation.in

      - name: Datenbank wählen
        if: matrix.database == 'postgres'
        run: echo "DATABASE_URL=postgres://baukasten:baukasten@localhost:5432/baukasten" >> "$GITHUB_ENV"

      - name: Django-Prüfungen
        run: python manage.py check

      - name: Keine vergessenen Migrationen
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test builder --noinput

  docker:
    name: Docker-Image baut
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Image bauen
        run: docker build -t baukasten:ci .
      - name: Image startet und antwortet auf /healthz und /readyz
        run: |
          docker run --rm -e SECRET_KEY=nur-fuer-ci baukasten:ci python manage.py hintergrund --help
          docker run -d --name baukasten -p 8000:8000 -e SECRET_KEY=nur-fuer-ci -e DATABASE_URL=sqlite:////tmp/ci.sqlite3 baukasten:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz && curl -fsS http://localhost:8000/readyz; then exit 0; fi
            sleep 2
          done
          docker logs baukasten
          exit 1
