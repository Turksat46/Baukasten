# Vorlage. Als secret.yaml kopieren, Werte eintragen, NICHT ins Repository einchecken.
# Besser: die bei euch übliche Secret-Verwaltung (z. B. Vault oder Sealed Secrets) verwenden.
apiVersion: v1
kind: Secret
metadata:
  name: baukasten-secret
type: Opaque
stringData:
  # Erzeugen mit: python -c "import secrets; print(secrets.token_urlsafe(50))"
  SECRET_KEY: "HIER-EINEN-LANGEN-ZUFALLSWERT-EINTRAGEN"
  DATABASE_URL: "postgres://BENUTZER:PASSWORT@postgres-host:5432/baukasten"
  # Optional: gemeinsamer Cache in Redis (siehe k8s/redis.yaml). Leer = Tabelle in PostgreSQL.
  # REDIS_PASSWORD: "LANGER-ZUFALLSWERT"
  # REDIS_URL: "redis://:LANGER-ZUFALLSWERT@baukasten-redis:6379/0"
  # Optional: Überwachung über /metrics (Prometheus). Ohne Wert gibt es /metrics nicht.
  # METRICS_TOKEN: "LANGER-ZUFALLSWERT"
  # Nur mit Keycloak:
  OIDC_CLIENT_SECRET: ""
  # Datenquellen (nur lesende Benutzer verwenden!). Der Teil nach DATASOURCE_ wird zum Namen der Quelle.
  # DATASOURCE_LAGER: "postgresql://leser:PASSWORT@db.example.com:5432/lager"
  # DATASOURCE_DWH: "databricks://token:dapi…@adb-123.azuredatabricks.net/sql/1.0/warehouses/abc?catalog=main&schema=werk"
---
# Geheimnisse für Skripte von Automatisierungen (optional). Nur der Pod baukasten-worker bekommt
# sie. Im Skript: secret("ERP_TOKEN") liest SCRIPT_SECRET_ERP_TOKEN. Alle Automatisierungen
# sehen alle Einträge – nur Zugänge eintragen, die Automatisierer nutzen dürfen.
apiVersion: v1
kind: Secret
metadata:
  name: baukasten-skript-geheimnisse
type: Opaque
stringData:
  # SCRIPT_SECRET_ERP_TOKEN: "…"
  # SCRIPT_SECRET_SFTP_PASSWORT: "…"
