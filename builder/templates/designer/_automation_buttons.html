{% load i18n %}<form method="post" action="{% url 'designer_script_start' app.slug sc.pk %}">{% csrf_token %}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="{{ button_class|default:'link' }}" data-action="start"{% if not sc.can_start %} hidden{% endif %}>{% if sc.trigger == "continuous" %}{% translate "Einschalten" %}{% else %}{% translate "Jetzt starten" %}{% endif %}</button></form>
<form method="post" action="{% url 'designer_script_stop' app.slug sc.pk %}">{% csrf_token %}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="{{ button_class|default:'link' }} danger" data-action="stop"{% if not sc.can_stop %} hidden{% endif %}>{% if sc.trigger == "continuous" %}{% translate "Ausschalten" %}{% else %}{% translate "Stoppen" %}{% endif %}</button></form>
