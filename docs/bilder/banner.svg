<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Baukasten – Interne Apps aus Tabellen, Seiten und Bausteinen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00525d"/>
      <stop offset="1" stop-color="#003a43"/>
    </linearGradient>
    <style>
      .t { font-family: "IBM Plex Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .panel { fill: #fff; fill-opacity: .09; }
      .soft { fill: #fff; fill-opacity: .28; }
      .strong { fill: #fff; fill-opacity: .92; }
      .accent { fill: #d98a1f; }
    </style>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <circle cx="1210" cy="-20" r="190" fill="#fff" fill-opacity=".04"/>
  <circle cx="40" cy="430" r="150" fill="#fff" fill-opacity=".04"/>

  <!-- Logo + Wortmarke -->
  <g transform="translate(72 70) scale(1.5)">
    <rect x="2" y="2" width="13" height="13" rx="3" fill="#7fb9bf"/>
    <rect x="17" y="2" width="13" height="13" rx="3" fill="#ffffff" fill-opacity=".9"/>
    <rect x="2" y="17" width="13" height="13" rx="3" fill="#ffffff" fill-opacity=".9"/>
    <rect x="17" y="17" width="13" height="13" rx="6.5" fill="#d98a1f"/>
  </g>
  <text x="130" y="105" class="t" font-size="30" font-weight="700" fill="#fff">Baukasten</text>

  <!-- Claim -->
  <text class="t" font-size="46" font-weight="700" fill="#fff">
    <tspan x="72" y="196">Interne Apps aus Tabellen,</tspan>
    <tspan x="72" y="252">Seiten und Bausteinen.</tspan>
  </text>
  <text x="72" y="298" class="t" font-size="21" fill="#fff" fill-opacity=".78">Daten festlegen, Seite zusammenstellen, veröffentlichen.</text>

  <!-- Merkmale -->
  <g class="t" font-size="15" font-weight="600" fill="#fff">
    <rect x="72" y="330" width="122" height="34" rx="17" fill="#fff" fill-opacity=".12"/>
    <text x="133" y="352" text-anchor="middle">42 Bausteine</text>
    <rect x="206" y="330" width="150" height="34" rx="17" fill="#fff" fill-opacity=".12"/>
    <text x="281" y="352" text-anchor="middle">API &amp; MCP-Server</text>
    <rect x="368" y="330" width="122" height="34" rx="17" fill="#fff" fill-opacity=".12"/>
    <text x="429" y="352" text-anchor="middle">Data Science</text>
    <rect x="502" y="330" width="106" height="34" rx="17" fill="#fff" fill-opacity=".12"/>
    <text x="555" y="352" text-anchor="middle">Kubernetes</text>
  </g>

  <!-- Motiv der Anmeldeseite -->
  <g transform="translate(790 66) scale(1.0)">
    <rect x="0" y="0" width="230" height="26" rx="6" class="strong"/>
    <rect x="0" y="36" width="150" height="10" rx="5" class="soft"/>
    <rect x="266" y="0" width="94" height="34" rx="8" class="accent"/>
    <rect x="0" y="70" width="110" height="70" rx="10" class="panel"/>
    <rect x="125" y="70" width="110" height="70" rx="10" class="panel"/>
    <rect x="250" y="70" width="110" height="70" rx="10" class="panel"/>
    <rect x="14" y="86" width="46" height="8" rx="4" class="soft"/>
    <rect x="14" y="104" width="70" height="20" rx="5" class="strong"/>
    <rect x="139" y="86" width="46" height="8" rx="4" class="soft"/>
    <rect x="139" y="104" width="58" height="20" rx="5" class="strong"/>
    <rect x="264" y="86" width="46" height="8" rx="4" class="soft"/>
    <rect x="264" y="104" width="76" height="20" rx="5" class="strong"/>
    <rect x="0" y="156" width="172" height="144" rx="10" class="panel"/>
    <rect x="16" y="176" width="130" height="10" rx="5" class="accent"/>
    <rect x="16" y="200" width="96" height="10" rx="5" class="strong"/>
    <rect x="16" y="224" width="64" height="10" rx="5" class="strong"/>
    <rect x="16" y="248" width="40" height="10" rx="5" class="soft"/>
    <rect x="188" y="156" width="172" height="144" rx="10" class="panel"/>
    <rect x="204" y="250" width="22" height="34" rx="4" class="soft"/>
    <rect x="234" y="226" width="22" height="58" rx="4" class="strong"/>
    <rect x="264" y="238" width="22" height="46" rx="4" class="soft"/>
    <rect x="294" y="200" width="22" height="84" rx="4" class="accent"/>
    <rect x="324" y="216" width="22" height="68" rx="4" class="strong"/>
    <rect x="204" y="176" width="100" height="8" rx="4" class="soft"/>
  </g>
</svg>
